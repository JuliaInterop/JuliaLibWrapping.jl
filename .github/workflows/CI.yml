name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The two packages live in sibling subdirectories of this monorepo.
        # `setup-julia`'s `project` input resolves `min` from each package's
        # own [compat], so they can carry different lower bounds.
        package:
          - JuliaLibWrapping
          - JLWInterop
        version:
          - 'min'
          - 'pre'
          - 'nightly'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
        exclude:
          # JuliaLibWrapping's compat floor is julia = "1.13", which has no
          # stable release yet, so setup-julia cannot resolve `min` for it.
          # Re-enable this cell once 1.13.0 final ships. (Not OS-specific:
          # this excludes the combination on every OS in the matrix, since
          # the entry names no `os`/`arch` key.)
          - package: JuliaLibWrapping
            version: 'min'
        include:
          - package: JuliaLibWrapping
            coverage_dirs: JuliaLibWrapping/src,JuliaLibWrapping/ext
          - package: JLWInterop
            coverage_dirs: JLWInterop/src
          # juliac --trim is currently broken on Julia nightly (verifier
          # errors in Base, e.g. unresolved HashState/IOContext calls);
          # keep the signal visible without failing the workflow.
          - package: JuliaLibWrapping
            version: 'nightly'
            experimental: true
          # macOS/Windows are newly added to the matrix; keep them soft-fail
          # until a green run confirms each OS end-to-end. Drop these once
          # proven (see docs/superpowers/plans/2026-08-21-jlw-xplat.md, Task 3).
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          # macos-latest is an Apple Silicon (arm64) runner; matrix.arch is
          # x64 for the ubuntu/windows cells, so override it to "default"
          # (let setup-julia pick the host's native arch) on macOS instead of
          # forcing an x64 Julia onto an arm64 runner.
          arch: ${{ matrix.os == 'macos-latest' && 'default' || matrix.arch }}
          project: ${{ matrix.package }}
      - uses: julia-actions/cache@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # On Windows, MinGW-w64 is pre-installed at C:\msys64\mingw64\bin but is
      # not on PATH. Add it so the `gcc`/`clang` availability gates in
      # test_build_library.jl's end-to-end tests find a compiler.
      - name: Set up MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.package }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: ${{ matrix.coverage_dirs }}
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'pre'
          project: JuliaLibWrapping/docs
      - uses: julia-actions/cache@v3
      - name: Build and deploy documentation
        # The docs environment pulls JuliaLibWrapping and JLWInterop in via its
        # own [sources], so a plain instantiate is enough — no separate
        # Pkg.develop step. make.jl is run directly as a script (not via
        # `include` under a `julia {0}` shell, where a relative include path
        # resolves against the temp script's directory rather than the repo
        # root); makedocs derives its root from make.jl's own location.
        # julia-docdeploy is avoided because it hard-codes a top-level `docs/`.
        run: |
          julia --project=JuliaLibWrapping/docs -e 'using Pkg; Pkg.instantiate()'
          julia --project=JuliaLibWrapping/docs --color=yes JuliaLibWrapping/docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
